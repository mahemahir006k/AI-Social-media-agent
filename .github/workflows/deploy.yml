name: Deploy AI Social Media Agent

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/AI-Social-media-agent

            git pull origin main

            if git diff --name-only HEAD@{1} HEAD | grep -q '^xexnaro-poster/'; then
              sudo systemctl restart xexnaro-poster
              sudo systemctl restart xexnaro-scheduler
            fi

            if git diff --name-only HEAD@{1} HEAD | grep -q '^facebook-poster/'; then
              sudo systemctl restart xenhra-scheduler
            fi
